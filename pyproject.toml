[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-checkpoints-vs-stores"
version = "0.1.0"
description = "Runnable LangGraph examples comparing checkpoints and stores."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Nic Cravino"}]
dependencies = [
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "rich==14.3.4",
  "typing-extensions==4.16.0",
]

[project.optional-dependencies]
backends = [
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-redis==0.6.0",
  "psycopg[binary]==3.3.8",
]
dev = [
  "langgraph-checkpoints-vs-stores[backends]",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
lg-memory-demo = "checkpoints_vs_stores.demo:main"
lg-memory-demo2 = "checkpoints_vs_stores.chapter2:main"
lg-memory-demo3 = "checkpoints_vs_stores.chapter3:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
